name: Onboard App

env:
  TARGET_IP: 192.168.1.12
  HOST_PORT: 8200
  BAO_APP_DIR: /home/runner/apps/${{ github.event.repository.name }}

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Name of the repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  onboard:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null; then
            case "$(uname -m)" in
              x86_64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
            esac
            mkdir -p "$RUNNER_TEMP/bin"
            curl -sSfL -o "$RUNNER_TEMP/bin/jq" "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-$arch"
            chmod +x "$RUNNER_TEMP/bin/jq"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch OpenBao CA certificate
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i /home/runner/.ssh/deploy_key runner@${{ env.TARGET_IP }} \
            "cat '${{ env.BAO_APP_DIR }}/tls/bao.crt'" > "$RUNNER_TEMP/bao.crt"

      - name: Onboard
        env:
          BAO_ADDR: https://${{ env.TARGET_IP }}:${{ env.HOST_PORT }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          GH_TOKEN: ${{ secrets.BAO_GH_TOKEN }}
          APP: ${{ inputs.app_name }}
          REPO: ${{ github.repository_owner }}/${{ inputs.app_name }}
        run: BAO_CACERT="$RUNNER_TEMP/bao.crt" bash scripts/onboard-app.sh "$APP" "$REPO"
